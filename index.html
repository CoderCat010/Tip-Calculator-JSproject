<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>

    <!-- css link -->
     <link rel="stylesheet" href="style.css">
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-indigo-500 h-screen flex justify-center items-center">
    
    <div class="w-[450px] h-[550px] bg-[#ffffff] rounded-xl">
        <!-- bill -->
         <div>
            <p>Bill</p>
            <input placeholder="$ 0.00" type="number">
         </div>

         <!-- tip -->
         <div>
            <p>Tip</p>
            <p>$0</p>
         </div>

         <!-- total ammount -->
          <div>
            <p>Total Amount</p>
            <p>$0</p>
         </div>

         <!-- tip -->
          <div>
            <p>Tip %</p>
            <p>15%</p>
            <span>
                <input type="range" min="0" max="100" value="40" class="range range-xs text-black [--range-bg:#615fff]  [--range-fill:0]" />
            </span>
          </div>
          
         <!-- total people -->
          <div>
            <p>Tip %</p>
            <p>15%</p>
            <span>
                <input type="range" min="0" max="100" value="40" class="range range-xs text-black [--range-bg:#615fff]  [--range-fill:0]" />
            </span>
          </div>

          <!-- calculation -->
          <div>
            <!-- tip per person calculation -->
            <p>Total Amount</p>
            <p>$0</p>

            <!-- calculate total ammount -->
            <p>Total Amount</p>
            <p>$0</p>
         </div>
    </div>
    

    <!-- js file -->
     <script src="./script.js"></script>
</body>
</html>

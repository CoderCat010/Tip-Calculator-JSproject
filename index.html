<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>

    <!-- css link -->
     <link rel="stylesheet" href="style.css">
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-indigo-500 h-screen flex justify-center items-center">
    
    <div class="w-[450px] h-[550px] bg-[#ffffff] rounded-xl py-12 px-10">
        <!-- 
        bill 
         -->
         <div class="flex justify-between text-lg">
            <p class="text-[#00000098] font-semibold">Bill</p>
            <!-- input box -->
            <p class="bg-[#625fff54] text-[#625fff7c] px-2 font-medium">$  
              <span>
                <input id="bill" class="w-[80px] font-semibold border-none outline-none p-1 text-[#625fffe1]" placeholder="0.00" type="number">
              </span>
            </p>
         </div>

         <!-- tip -->
         <div class="flex justify-between text-[#00000098] font-semibold py-3 text-lg border-b border-[#00000013]">
            <p>Tip</p>
            <p>$
              <span id="totalTip">0</span>
            </p>
         </div>

         <!-- total ammount -->
          <div class="flex justify-between text-[#00000098] font-[500] py-3 text-lg">
            <p>Total Amount</p>
            <p>$
              <span id="total_amount">0</span>
            </p>
         </div>

         <!-- tip range -->
          <div class="flex flex-col py-3">
            <div class="flex justify-between text-[#00000098] font-semibold text-lg pb-3">
              <p>Tip %</p>
              <p id="tip_amount">0</p>
            </div>
            <input class="bg-indigo-500" id="tip_percentage" type="range" min="1" value="15">
          </div>
          
         <!-- total people range -->
          <div class="flex flex-col py-3">
            <div class="flex justify-between text-[#00000098] font-semibold text-lg pb-3">
              <p>No. of people</p>
              <p id="totalPeople">0</p>
            </div>
            <input id="people_percentage" type="range" min="1" max="15" value="1">
          </div>

          <!-- calculation -->
          <div class="flex flex-col bg-[#625fff54] text-[#625fff] p-5 mt-8 rounded-lg">
            <!-- tip per person calculation -->
            <div class="flex justify-between font-medium text-lg">
              <p>Tip per person</p>
              <p>$
                <span id="perPerson_tip">0</span>
              </p>
            </div>

            <!-- calculate total ammount -->
            <div class="flex justify-between font-medium pt-3 text-lg">
              <p>Total per person</p>
              <p>$
                <span id="totalCalculation">0</span>
              </p>
            </div>
         </div>
    </div>
    

    <!-- js file -->
     <script src="./script1.js"></script>
</body>
</html>
